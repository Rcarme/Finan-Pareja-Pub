name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      APP_SECRET_KEY: ci_secret_key_at_least_32_characters_long!

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finanzas_test
          POSTGRES_USER: finanzas_test
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pytest pytest-cov ruff mypy

    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with Mypy
      run: |
        mypy app

    - name: Run Gitleaks secret scanner
      run: |
        curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
        echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
        tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
        /tmp/gitleaks detect --verbose --redact --log-opts="--all"

    - name: Security audit dependencies with pip-audit
      run: |
        pip install pip-audit
        pip-audit -r requirements.lock

    - name: Run Alembic migrations against PostgreSQL
      env:
        ENVIRONMENT: test
        APP_SECRET_KEY: ci_secret_key_at_least_32_characters_long!
        DATABASE_URL: postgresql+psycopg://finanzas_test:test_password_123@127.0.0.1:5432/finanzas_test
      run: |
        python -m alembic --raiseerr upgrade head 2>&1 | tee /tmp/alembic.log || {
          echo "### Alembic Migration Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/alembic.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }

    - name: Run unit and integration tests
      env:
        ENVIRONMENT: test
        APP_SECRET_KEY: ci_secret_key_at_least_32_characters_long!
        DATABASE_URL: postgresql+psycopg://finanzas_test:test_password_123@127.0.0.1:5432/finanzas_test
        TEST_DATABASE_URL: postgresql+psycopg://finanzas_test:test_password_123@127.0.0.1:5432/finanzas_test
      run: |
        python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log || {
          echo "### Pytest Failure Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }
