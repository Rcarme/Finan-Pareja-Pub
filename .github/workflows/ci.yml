name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pytest pytest-cov ruff mypy

    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with Mypy
      run: |
        mypy app

    - name: Run Gitleaks secret scanner
      run: |
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
        /tmp/gitleaks detect --verbose --redact

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v
