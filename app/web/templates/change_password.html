{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Cambiar contraseña</h2>
    <p style="color: var(--text-muted); font-size: 0.875rem; text-align: center; margin-bottom: 1rem;">
        La contraseña debe tener un mínimo de 12 caracteres.
    </p>

    {% if error %}
    <div style="background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/change-password" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
            <label for="current_password" style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem;">
                Contraseña actual
            </label>
            <input 
                type="password" 
                id="current_password" 
                name="current_password" 
                required 
                autocomplete="current-password"
                style="width: 100%; min-height: 44px; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-color); font-size: 1rem;"
            >
        </div>

        <div>
            <label for="new_password" style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem;">
                Nueva contraseña (mínimo 12 caracteres)
            </label>
            <input 
                type="password" 
                id="new_password" 
                name="new_password" 
                minlength="12"
                required 
                autocomplete="new-password"
                style="width: 100%; min-height: 44px; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-color); font-size: 1rem;"
            >
        </div>

        <div>
            <label for="confirm_password" style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem;">
                Confirmar nueva contraseña
            </label>
            <input 
                type="password" 
                id="confirm_password" 
                name="confirm_password" 
                minlength="12"
                required 
                autocomplete="new-password"
                style="width: 100%; min-height: 44px; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-color); font-size: 1rem;"
            >
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">
            Actualizar contraseña
        </button>
    </form>
</div>
{% endblock %}
