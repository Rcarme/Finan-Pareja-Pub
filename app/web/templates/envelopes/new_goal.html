{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Nueva Meta de Ahorro</h2>
        <a href="/envelopes" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">✕ Cancelar</a>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">
        Definí un objetivo y una fecha. El sistema calculará automáticamente el aporte mensual sugerido (RN-17).
    </p>

    <form method="POST" action="/envelopes/new-goal">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="idempotency_token" value="{{ idem_token() }}">

        <div class="form-group">
            <label class="form-label" for="name">Nombre del sobre o meta</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Ej: Vacaciones en Brasil, Heladera nueva..." required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="envelope_type">Tipo de apartado</label>
            <select id="envelope_type" name="envelope_type" class="form-control">
                <option value="goal">Meta con objetivo y fecha (RN-17)</option>
                <option value="savings">Sobre de ahorro adicional (RN-45)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="target_amount">Monto objetivo ($)</label>
            <input 
                type="text" 
                id="target_amount" 
                name="target_amount" 
                inputmode="decimal" 
                placeholder="0,00" 
                class="form-control" 
                style="font-size: 1.35rem; font-weight: 700; text-align: right;"
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="target_date">Fecha límite estimada</label>
            <input type="date" id="target_date" name="target_date" class="form-control">
        </div>

        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Crear Sobre / Meta
            </button>
        </div>
    </form>
</div>
{% endblock %}
